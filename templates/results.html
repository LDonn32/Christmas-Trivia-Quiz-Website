<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Score</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="snowflakes">
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
        <span>❄</span>
    </div>

    <div class="quiz-container">

        <h1>🎅 Quiz Complete!</h1>

        <h2>Your Score:</h2>

        <div class="score">
            {{ score }}/12
        </div>

        <h3>{{ message }}</h3>

        <form action="/">
            <button type="submit">
                Play Again
            </button>
        </form>

    </div>

</body>
</html>
